<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1110">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https:; font-src 'self'; object-src 'none'; base-uri 'self'">
  <title>Fluxo Mobile</title>
  <link rel="icon" href="./icon.ico">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./themes.css">
  <link rel="stylesheet" href="./themes-extra.css">
  <script src="./vendor/lucide.min.js" defer></script>
  <script src="./app.js" type="module"></script>
</head>
<body class="theme-fluxobug">
  <div id="app">
    <header class="topbar"><a class="brand" href="#library" aria-label="Fluxo, biblioteca"><img src="./assets/brand-mark.png" alt=""><strong>FLUXO<span>mobile</span></strong></a><span id="connection" class="connection"></span><button class="icon-button" data-action="import" title="Importar músicas" aria-label="Importar músicas"><i data-lucide="folder-plus"></i></button></header>
    <main id="view" tabindex="-1"></main>
    <section id="mini" class="mini" aria-label="Música atual" hidden></section>
    <nav class="navigation" aria-label="Navegação principal">
      <a href="#library" data-tab="library"><i data-lucide="library"></i><span>Biblioteca</span></a>
      <a href="#search" data-tab="search"><i data-lucide="search"></i><span>Buscar</span></a>
      <a href="#queue" data-tab="queue"><i data-lucide="list-music"></i><span>Fila</span></a>
      <a href="#settings" data-tab="settings"><i data-lucide="sliders-horizontal"></i><span>Ajustes</span></a>
    </nav>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <dialog id="player" aria-label="Reproduzindo agora"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
